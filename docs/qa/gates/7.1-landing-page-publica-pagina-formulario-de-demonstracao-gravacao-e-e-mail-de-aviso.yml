observations:
  - 'Honeypot antes da validação (rules() vazio) está correto: o robô não aprende nada pelas mensagens de erro.'
  - 'A página 429 própria via Limit::response() não afeta os 429 da API e tem noindex.'
  - 'O e-mail text/plain usa {!! !!} de propósito: não é HTML. O HTML escapa tudo e usa nl2br(e()) na mensagem.'
  - 'A migration usa string(20) para status, não enum. É portável e bate com o CA08.'
  - 'Desvio MAIL_ENCRYPTION → MAIL_SCHEME conferido no config/mail.php do Laravel: correto.'
  - 'O link do e-mail para /backoffice/demonstracoes dá 404 até a 7.2. É esperado.'

