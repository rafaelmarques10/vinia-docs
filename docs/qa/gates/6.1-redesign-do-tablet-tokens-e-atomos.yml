top_issues:
  - id: 'REQ-001'
    severity: medium
    finding: 'CA04 liga --wine/--gold às cores do restaurante, mas as colunas restaurants.primary_color e secondary_color são NOT NULL com default #7B2D8B (roxo) e #C0392B (vermelho) na migration. Os defaults da marca (#6E1A22/#D4AF37) quase nunca valem na prática. Restaurante que não personalizou as cores vê o botão primário roxo e os detalhes "dourados" em vermelho, com contraste de 3,33:1 sobre --bg (falha no AA; a tabela do CA01 só vale para os defaults).'
    suggested_action: 'Antes do push/deploy: conferir primary/secondary dos restaurantes reais em produção e ajustá-los, ou abrir story (@po/@data-engineer) para trocar o default da migration para #6E1A22/#D4AF37 e validar contraste no RestaurantSettings.'
  - id: 'REL-001'
    severity: medium
    finding: 'Com o reset em @layer base, todo utilitário de padding/margin, e também bg/border/font-size/font-family em <button>, que antes era anulado passa a valer. O efeito é maior do que o @dev listou: header da WineHomePage (px-[14px]), taça decorativa centralizada (mx-auto), card "Sugestão do Sommelier" com fundo bg-surface, estado vazio da WineListPage (py-12), e botões com text-sm ou text-[12.5px] que diminuem de 16px. O "Ver Carta" da EntryPage cai para 12,5px, abaixo do piso de 13px. Nas screenshots, AssistantPage e EntryPage ficaram claramente melhores (cards com borda/padding e botão vinho), mas são mudanças visuais nas telas.'
    suggested_action: 'Rafael confere no tablet real as telas listadas em QA Results. Os tamanhos abaixo de 13px nos botões das páginas ficam com as stories 6.2 a 6.5, que não podem esquecer deles.'
  - id: 'TEST-001'
    severity: low
    finding: 'O jsdom não tem CSS.supports, então o ramo de validação de cor inválida do ThemeProvider nunca roda nos testes: "banana" é gravado como válido. Em navegador real o guard funciona e o backend já valida /^#[0-9A-Fa-f]{6}$/.'
    suggested_action: 'Adicionar um teste com vi.stubGlobal do CSS.supports cobrindo valor inválido -> removeProperty.'
  - id: 'MNT-001'
    severity: low
    finding: '--hairline e --hairline-strong continuam fixos em rgba(212,175,55,…) e não acompanham a secundária do restaurante.'
    suggested_action: 'Avaliar na 6.2: derivar com color-mix(var(--gold) 16%/35%, transparent), se a spec pedir.'
  - id: 'DOC-001'
    severity: low
    finding: 'CodeRabbit não foi executado (CLI configurado para WSL; ambiente macOS).'
    suggested_action: 'Opcional: rodar CodeRabbit no PR pelo @devops.'

