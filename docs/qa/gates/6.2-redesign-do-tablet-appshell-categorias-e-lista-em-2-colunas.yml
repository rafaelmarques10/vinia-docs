story_title: 'Redesign do Tablet — AppShell, Categorias e Lista em 2 Colunas'
gate: CONCERNS
status_reason: 'Todos os CAs do escopo (CA01–CA16, CA22, CA23, CA25–CA28) estão implementados e testados, com test/typecheck/lint/build verdes, e o CA09 foi medido em Chrome real: 336px em 1080 e 459px em 1366, sem desvio. O que fica é o risco REQ-001 da 6.1 (cores padrão do banco), agora visível em toda a carta, e três ajustes visuais baixos.'
reviewer: 'Quinn'
updated: '2026-10-07T12:40:00-03:00'
