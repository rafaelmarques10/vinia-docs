status_reason: >-
  CA01 a CA21 conferidos no código, na suíte (SQLite e MySQL 8) e no navegador real. Os valores de referência do CA12
  batem exatamente. applySuggestion só aceita primary/secondary, recalcula no servidor e não grava. O style só recebe
  #RRGGBB, e a tentativa de adulterar pelo $wire não injeta nada. Sem regressão da 6.7.
