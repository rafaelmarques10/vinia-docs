evidence:
  tests_sqlite: 'php artisan test — 227/227 (166.010 asserções; inclui a grade de 4.096 cores em 4 papéis)'
  tests_mysql: 'Mesma suíte no MySQL 8.0.46 (container vinia-mysql, banco descartável apagado no fim): 227/227. Fecha a pendência local do CA20; o job do CI roda no push'
  reference_values: '#1B3C1F; #F18383; #E38B82; #0E2010 + #D85D50. Aplicar secundária→primária e primária→secundária dá o mesmo resultado, e feedback() fica vazio no fim'
  tampering: >-
    Livewire::test e $wire no navegador: applySuggestion com "name", "primary_color", "PRIMARY", " primary", "", "secondary_color"
    e "restaurant" não altera nada. applySuggestion("primary", "#000000") ignora o hex do cliente e aplica #1B3C1F. Nenhuma
    applySuggestion grava no banco. Com set primary_color = "red;background-image:url(//evil.example/x)" e secondary
    "</style><script>...", nenhum style e nenhum HTML contém o valor. O save() recusa com erro de formato.
    set("restaurant.id", outro) → exceção "Can't set model properties directly", e o outro restaurante fica intacto.
  browser: >-
    Chrome headless (Playwright), php artisan serve :8600, SQLite próprio + DemoSeeder, demo@lavigne.com.
    #9cd3a3/#f07a7a: só a primária mostra a mensagem do CA01 + "Contraste medido: 1,48:1 (mínimo 4,5:1)." + botão
    "Usar sugestão #1B3C1F"; secundária sem mensagem; prévia "Difícil de ler" x2. Clique → #1B3C1F, botão some, foco no
    campo de texto da primária (x-ref primaryColorText), prévia "Fácil de ler" x2; Salvar grava. Duas falhas → dois botões
    (#0E2010, #D85D50); aplicar um deixa só o outro; aplicar os dois deixa tudo válido. Save reprovado (#C0392B) → uma
    mensagem só no campo; ao corrigir para #D4AF37 o erro velho some. Campos vazios + Salvar → banco #6E1A22/#D4AF37.
    600px: amostras empilhadas. Console sem erros.

